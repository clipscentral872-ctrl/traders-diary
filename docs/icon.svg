<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Traders Diary">
  <defs>
    <!-- The columns lift from deep to bright, so they read as solid objects
         standing on the axis rather than flat blocks pasted on it. -->
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7FA8"/>
      <stop offset="1" stop-color="#14344A"/>
    </linearGradient>

    <!-- The area under the move, fading out downward the way a chart's area
         series does. This is the thing that makes it read as a chart. -->
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BE08A" stop-opacity=".46"/>
      <stop offset="1" stop-color="#2BE08A" stop-opacity="0"/>
    </linearGradient>

    <!-- The move itself, brightening as it climbs. -->
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22B877"/>
      <stop offset="1" stop-color="#5BFFB0"/>
    </linearGradient>

    <radialGradient id="halo" cx="72%" cy="30%" r="62%">
      <stop offset="0" stop-color="#2BE08A" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2BE08A" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05070C"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Gridlines, faint, the way a chart shows its scale. -->
  <g stroke="#35E0F0" stroke-width="5" opacity=".18">
    <line x1="92" y1="330" x2="440" y2="330"/>
    <line x1="92" y1="242" x2="440" y2="242"/>
    <line x1="92" y1="154" x2="440" y2="154"/>
  </g>

  <!-- Three columns, climbing, with a lit top edge. -->
  <g>
    <rect x="128" y="278" width="72" height="140" rx="8" fill="url(#col)"/>
    <rect x="222" y="212" width="72" height="206" rx="8" fill="url(#col)"/>
    <rect x="316" y="126" width="72" height="292" rx="8" fill="url(#col)"/>
    <g fill="#4FA8D8" opacity=".85">
      <rect x="128" y="278" width="72" height="5" rx="2.5"/>
      <rect x="222" y="212" width="72" height="5" rx="2.5"/>
      <rect x="316" y="126" width="72" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- The area under the move. -->
  <path d="M108 376 L196 300 L262 338 L356 190 L356 418 L108 418 Z"
        fill="url(#area)"/>

  <!-- The move, glowing, with a solid head rather than two crossed strokes. -->
  <g filter="url(#glow)">
    <path d="M108 376 L196 300 L262 338 L352 196"
          fill="none" stroke="url(#line)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 172 L388 156 L372 244 Z" fill="#5BFFB0"/>
  </g>

  <!-- The axes last, so they sit cleanly over everything. -->
  <g stroke="#35E0F0" stroke-width="15" stroke-linecap="round">
    <line x1="92" y1="76" x2="92" y2="418"/>
    <line x1="92" y1="418" x2="440" y2="418"/>
  </g>
</svg>
