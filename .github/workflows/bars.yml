name: Publish candles

# A browser cannot fetch a market feed, so the bars the charts are drawn on are
# fetched here and committed next to the page. The one-minute window is only
# about a week wide, so every day this does not run is a day of history lost
# for good.

on:
  schedule:
    # 22:10 UTC, after the US cash session has closed and settled.
    - cron: "10 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-candles
  cancel-in-progress: false

jobs:
  bars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the bars
        run: python tools/publish_bars.py

      - name: Commit them if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bars
          # A run on a market holiday changes nothing, and an empty commit
          # every weekday would bury the real history.
          if git diff --cached --quiet; then
            echo "no new bars"
            exit 0
          fi
          git commit -m "candles $(date -u +%Y-%m-%d)"
          git push
